<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Mawww Protex</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <h1>Mawww <span style="color:#58a6ff;">Protex</span></h1>
    <p class="sub" style="color:#8b949e;margin-top:0;">Free Lua obfuscator — Delta compatible.</p>

    <div class="form-group">
      <label>Username atau Email</label>
      <input type="text" id="username" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <div class="row">
      <button id="btn" onclick="login()">Login</button>
      <span style="color:#8b949e;font-size:13px;">Belum punya akun? <a href="/register">Daftar</a></span>
    </div>
    <div id="status" class="status"></div>
  </div>
</div>
<div id="toast"></div>
<script src="/toast.js"></script>
<script>
const $ = (id) => document.getElementById(id);
async function login() {
  const btn = $('btn'), st = $('status');
  btn.disabled = true; st.className = 'status'; st.textContent = 'Memproses...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('username').value, password: $('password').value })
    });
    const data = await res.json();
    if (!res.ok) { st.className = 'status err'; st.textContent = data.error; return; }
    window.location.href = '/dashboard';
  } catch (e) { st.className = 'status err'; st.textContent = e.message; }
  finally { btn.disabled = false; }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
