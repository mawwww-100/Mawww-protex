<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar — Mawww Protex</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <h1>Daftar <span style="color:#58a6ff;">Mawww Protex</span></h1>
    <p class="sub" style="color:#8b949e;margin-top:0;">Gratis untuk semua orang.</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" />
      <div class="hint">3-20 karakter, huruf/angka/underscore.</div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" />
      <div class="hint">Minimal 6 karakter.</div>
    </div>
    <div class="row">
      <button id="btn" onclick="register()">Daftar</button>
      <span style="color:#8b949e;font-size:13px;">Sudah punya akun? <a href="/login">Login</a></span>
    </div>
    <div id="status" class="status"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
async function register() {
  const btn = $('btn'), st = $('status');
  btn.disabled = true; st.className = 'status'; st.textContent = 'Memproses...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: $('username').value,
        email: $('email').value,
        password: $('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) { st.className = 'status err'; st.textContent = data.error; return; }
    window.location.href = '/dashboard';
  } catch (e) { st.className = 'status err'; st.textContent = e.message; }
  finally { btn.disabled = false; }
}
</script>
</body>
</html>
