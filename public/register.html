<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — Mawww Protex</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-header">
      <h1>Buat Akun</h1>
      <p>Daftar untuk mulai menggunakan Mawww Protex</p>
    </header>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />
      </div>
      <div class="field">
        <label for="confirm">Konfirmasi Password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
      </div>
      <button id="register-submit" class="btn btn-primary btn-block" type="submit">Daftar</button>
    </form>

    <p class="auth-footer">Sudah punya akun? <a href="/login">Masuk</a></p>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
